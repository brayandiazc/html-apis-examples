<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Notificaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>Notification API</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <button id="requestNotificationPermissionBtn">
          Solicitar Permiso de Notificación
        </button>
        <button id="showNotificationBtn">Mostrar Notificación</button>
        <div id="notificationStatus" class="output-area"></div>
        <article>
          <header>Vibration API</header>
          <button id="vibrateBtn">Vibrar (si es compatible)</button>
          <div id="vibrationStatus" class="output-area"></div>
        </article>
        <article>
          <header>Battery API</header>
          <button id="getBatteryStatusBtn">Obtener Estado de Batería</button>
          <div id="batteryStatus" class="output-area"></div>
        </article>
      </section>
    </main>
    <script src="../src/js/notifications.js"></script>
  </body>
</html>
