<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Seguridad</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>APIs de Seguridad</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <article>
          <header>Credential Management API</header>
          <button id="checkCredentialsBtn">
            Verificar Credenciales (conceptual)
          </button>
          <div id="credentialStatus" class="output-area"></div>
        </article>
        <article>
          <header>Permissions API</header>
          <button id="queryPermissionGeoBtn">
            Consultar Permiso de Geolocalización
          </button>
          <button id="queryPermissionNotificationsBtn">
            Consultar Permiso de Notificaciones
          </button>
          <div id="permissionStatus" class="output-area"></div>
        </article>
      </section>
    </main>
    <script src="../src/js/security.js"></script>
  </body>
</html>
