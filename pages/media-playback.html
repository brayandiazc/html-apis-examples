<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reproducción de Audio y Video</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>Reproducción de Audio y Video</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <input type="file" id="mediaInput" accept="audio/*,video/*" />
        <audio id="audioPlayer" controls style="display: none"></audio>
        <video
          id="videoPlayer"
          controls
          style="display: none; max-width: 100%"
        ></video>
        <div id="mediaStatus" class="output-area"></div>
      </section>
    </main>
    <script src="../src/js/media-playback.js"></script>
  </body>
</html>
