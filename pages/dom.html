<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo DOM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>APIs del DOM</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <article>
          <header>Document: querySelector, getElementById</header>
          <div id="elementToChange" class="output-area">
            Contenido original.
          </div>
          <button id="changeContentBtn">Cambiar Contenido</button>
          <button id="changeByIdBtn">Cambiar por ID</button>
        </article>
        <article>
          <header>Element, Node, Text: manipulación de nodos</header>
          <div id="nodeManipulationArea" class="output-area"></div>
          <button id="addNodeBtn">Añadir Nodo de Texto</button>
          <button id="removeNodeBtn">Eliminar Último Nodo</button>
        </article>
        <article>
          <header>Event: manejo de eventos</header>
          <button id="eventButton">Haz clic aquí (Evento)</button>
          <div id="eventOutput" class="output-area"></div>
        </article>
      </section>
    </main>
    <script src="../src/js/dom.js"></script>
  </body>
</html>
