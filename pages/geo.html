<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Geolocalización</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>API de Geolocalización</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <button id="getGeolocationBtn">Obtener Ubicación</button>
        <div id="geolocationStatus" class="output-area"></div>
        <div id="mapContainer" style="margin: 1rem 0"></div>
        <article>
          <header>DeviceOrientation / Motion API</header>
          <button id="startDeviceOrientationBtn">Iniciar Orientación</button>
          <button id="stopDeviceOrientationBtn">Detener Orientación</button>
          <button id="startDeviceMotionBtn">Iniciar Movimiento</button>
          <button id="stopDeviceMotionBtn">Detener Movimiento</button>
          <div id="deviceSensorStatus" class="output-area"><pre></pre></div>
        </article>
      </section>
    </main>
    <script src="../src/js/geo.js"></script>
  </body>
</html>
