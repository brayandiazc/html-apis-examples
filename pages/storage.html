<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Almacenamiento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>APIs de Almacenamiento</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <article>
          <header>LocalStorage y SessionStorage</header>
          <input
            type="text"
            id="storageKey"
            placeholder="Clave"
            value="miClave"
          />
          <input
            type="text"
            id="storageValue"
            placeholder="Valor"
            value="miValor"
          />
          <button id="saveToLocalStorageBtn">Guardar en LocalStorage</button>
          <button id="loadFromLocalStorageBtn">Cargar de LocalStorage</button>
          <button id="saveToSessionStorageBtn">
            Guardar en SessionStorage
          </button>
          <button id="loadFromSessionStorageBtn">
            Cargar de SessionStorage
          </button>
          <div id="storageStatus" class="output-area"></div>
        </article>
        <article>
          <header>Cookies API</header>
          <button id="setCookieBtn">Establecer Cookie</button>
          <button id="getCookieBtn">Mostrar Cookies</button>
          <div id="cookieStatus" class="output-area"></div>
        </article>
        <article>
          <header>IndexedDB</header>
          <input type="text" id="idbKey" placeholder="Clave" value="idbClave" />
          <input
            type="text"
            id="idbValue"
            placeholder="Valor"
            value="idbValor"
          />
          <button id="saveToIndexedDBBtn">Guardar en IndexedDB</button>
          <button id="loadFromIndexedDBBtn">Leer de IndexedDB</button>
          <div id="indexedDBStatus" class="output-area"></div>
        </article>
      </section>
    </main>
    <script src="../src/js/storage.js"></script>
  </body>
</html>
