<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Otras APIs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>Otras APIs útiles</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <article>
          <header>Canvas API (básico)</header>
          <canvas
            id="miniCanvas"
            width="300"
            height="150"
            class="bordered"
          ></canvas>
          <button id="drawOnMiniCanvasBtn">Dibujar en Canvas</button>
        </article>
        <article>
          <header>WebGL (placeholder)</header>
          <canvas
            id="webglCanvasPlaceholder"
            width="300"
            height="150"
            class="bordered"
          ></canvas>
          <div id="webglStatus" class="output-area"></div>
        </article>
        <article>
          <header>Web Animations API</header>
          <div id="animatedElement" class="animated-element"></div>
          <button id="animateElementBtn">Animar Elemento</button>
        </article>
      </section>
    </main>
    <script src="../src/js/other.js"></script>
  </body>
</html>
