<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Canvas - Dibujo y Colores</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>Canvas: Dibuja y elige color</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <label for="colorPicker">Color de línea:</label>
        <input type="color" id="colorPicker" value="#000000" />
        <label for="lineWidthRange"
          >Grosor de línea: <span id="lineWidthValue">2</span> px</label
        >
        <input type="range" id="lineWidthRange" min="1" max="20" value="2" />
        <canvas
          id="myCanvas"
          width="800"
          height="400"
          class="bordered responsive-canvas"
        ></canvas>
      </section>
    </main>
    <script src="../src/js/canvas.js"></script>
  </body>
</html>
