<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas con Imágenes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>Canvas: Cargar y Modificar Imágenes</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <input type="file" id="imageInput" accept="image/*" />
        <button id="invertBtn" disabled>Invertir colores</button>
        <button id="grayscaleBtn" disabled>Escala de grises</button>
        <button id="brightnessBtn" disabled>Brillo +</button>
        <button id="sepiaBtn" disabled>Sepia</button>
        <button id="flipHBtn" disabled>Voltear horizontal</button>
        <canvas
          id="imageCanvas"
          width="800"
          height="400"
          class="bordered responsive-canvas"
        ></canvas>
      </section>
    </main>
    <script src="../src/js/image-canvas.js"></script>
  </body>
</html>
