<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Cámara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/styles.css" />
    <script src="../src/js/theme.js"></script>
  </head>
  <body>
    <header class="page-header">
      <p class="brand">Web APIs</p>
      <button type="button" class="theme-toggle" aria-label="Cambiar tema">☾</button>
    </header>
    <main class="container">
      <header>
        <h1>Acceso a la Cámara</h1>
        <a class="back-link" href="../index.html">← Volver al inicio</a>
      </header>
      <section>
        <label for="cameraSelect">Selecciona la cámara:</label>
        <select id="cameraSelect"></select>
        <button id="startCameraBtn">Iniciar cámara</button>
        <div id="cameraStatus" class="output-area"></div>
        <video
          id="cameraVideo"
          autoplay
          playsinline
          class="bordered responsive-canvas"
        ></video>
      </section>
    </main>
    <script src="../src/js/camera.js"></script>
  </body>
</html>
